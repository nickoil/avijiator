<?xml version="1.0" encoding="UTF-8"?>
<!--
  Avijiator app icon — "Cutoff Knob". Mirrors PanelLookAndFeel's own rotary
  knob paint code (see drawRotarySlider): a teal fill-arc for "how far
  turned" plus an amber pointer for the exact position, on the app's own
  dark panel background. See documents/ui-design.md section 4 for the
  palette tokens this uses.

  Master vector for the exe icon (CMakeLists.txt ICON_BIG/ICON_SMALL) and
  for the later Android launcher icon. Regenerate the PNGs from this file
  if the design changes rather than hand-editing a raster.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <rect x="1" y="1" width="98" height="98" rx="21" fill="#1c2026" stroke="#2e353f" stroke-width="2"/>
  <path d="M28.8,73.2 A30,30 0 0 1 69.3,29.0" fill="none" stroke="#4ec9c0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="50" cy="52" r="24" fill="#1c2026" stroke="#2e353f" stroke-width="1"/>
  <line x1="50" y1="52" x2="62.2" y2="37.4" stroke="#e0a458" stroke-width="5" stroke-linecap="round"/>
  <circle cx="50" cy="52" r="3" fill="#e0a458"/>
</svg>
